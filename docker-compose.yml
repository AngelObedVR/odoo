services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: odoo:19.0
    container_name: odoo_web
    restart: unless-stopped
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=odoo
      - DB_PASSWORD=odoo
    volumes:
      - odoo-data:/var/lib/odoo
      # Mount the codebase to allow instant live-reloading / debugging of changes
      - .:/opt/odoo
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    container_name: odoo_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  odoo-data:
  odoo-db-data:
